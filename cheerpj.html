<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Java Stack Demo</title>
  <script src="https://cjrtnc.leaningtech.com/2.2/loader.js"></script>
  <style>
    body { font: 16px sans-serif; max-width: 720px; margin: 40px auto; }
    .controls { display: flex; gap: 8px; margin: 20px 0; }
    input, button { padding: 8px; }
    input { flex: 1; }
    #stack { display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; min-height: 220px; padding: 16px; border: 2px solid #888; }
    .item { padding: 12px; text-align: center; background: #d9eaff; border: 1px solid #579; }
    pre { min-height: 80px; padding: 12px; background: #f2f2f2; }
  </style>
</head>
<body>
  <h1>Java Stack Demo</h1>
  <p>Push values onto a LIFO stack, then remove the most recent value first.</p>

  <div class="controls">
    <input id="value" value="A" aria-label="Value to push">
    <button id="push">Push</button>
    <button id="pop">Pop</button>
    <button id="peek">Peek</button>
    <button id="export">Export</button>
  </div>

  <div id="stack" aria-live="polite"></div>
  <pre id="output">Ready.</pre>

  <button id="run">Run the Java MyStack class</button>

  <script>
    const stackElement = document.querySelector("#stack");
    const output = document.querySelector("#output");
    const stackJar = "/MyStack.jar?v=10";
    let javaStack;
    let javaInitPromise;

    function showError(error) {
      const message = error instanceof Error ? error.message : String(error);
      output.textContent = `Java error: ${message}`;
      console.error(error);
    }

    function javaString(value) {
      if (value && value.value0) {
        return String.fromCharCode(...Array.from(value.value0)).slice(1);
      }
      return String(value);
    }

    function render(values) {
      const text = String(values);
      const items = text === "[]" ? [] : text.slice(1, -1).split(", ");
      stackElement.replaceChildren(...items.map((value) => {
        const item = document.createElement("div");
        item.className = "item";
        item.textContent = value;
        return item;
      }));
    }

    async function callJava(method, ...args) {
      if (!javaInitPromise) {
        javaInitPromise = cheerpjInit({ preloadResources: [stackJar] })
          .then(() => cheerpjRunMain("MyStack", "/app/MyStack.jar"))
          .then(() => cjNew("MyStack"));
      }
      javaStack = await javaInitPromise;
      return javaString(await cjCall(javaStack, method, ...args));
    }

    document.querySelector("#push").addEventListener("click", async () => {
      const value = document.querySelector("#value").value.trim();
      if (!value) return;
      try {
        const values = await callJava("push", value);
        output.textContent = `push(${value})`;
        render(values);
      } catch (error) {
        showError(error);
      }
    });

    document.querySelector("#pop").addEventListener("click", async () => {
      try {
        const value = await callJava("pop");
        output.textContent = `pop() -> ${value}`;
        render(await callJava("contents"));
      } catch (error) {
        showError(error);
      }
    });

    document.querySelector("#peek").addEventListener("click", async () => {
      try {
        const value = await callJava("peek");
        output.textContent = `peek() -> ${value}`;
      } catch (error) {
        showError(error);
      }
    });

    document.querySelector("#export").addEventListener("click", async () => {
      try {
        let values = await callJava("export");
        // Older cached JARs may not contain export(); use the equivalent
        // contents() method until the updated JAR is loaded.
        if (values === "null" || values === "undefined") {
          values = await callJava("contents");
        }
        output.textContent = `export() -> ${values}`;
        render(values);
      } catch (error) {
        showError(error);
      }
    });

    document.querySelector("#run").addEventListener("click", async () => {
      output.textContent = "Starting CheerpJ... Java output will appear in the browser console.";
      try {
        const values = await callJava("contents");
        output.textContent = "Java MyStack is ready.";
        render(values);
      } catch (error) {
        showError(error);
      }
    });

    render("[]");
  </script>
</body>
</html>
